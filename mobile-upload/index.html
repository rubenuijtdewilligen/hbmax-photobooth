<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V&F Food & Events - Party Cam</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
  </head>
  <body
    class="min-h-screen bg-[#0B3B3C] text-white flex flex-col items-center justify-center p-6 text-center select-none font-sans"
  >
    <div
      class="w-full max-w-sm bg-[#08292A] border-2 border-[#D4AF37] p-6 shadow-2xl flex flex-col items-center gap-4 rounded-3xl"
    >
      <div class="w-32 py-1">
        <img
          src="./vf-logo.png"
          alt="V&F Food & Events"
          class="w-full h-auto drop-shadow"
        />
      </div>

      <div
        class="bg-[#E5BA5A] text-[#0B3B3C] px-5 py-1 font-black text-xs uppercase tracking-wider rounded-full shadow-md"
      >
        📱 Party Cam
      </div>

      <p
        id="status-message"
        class="text-sm font-semibold text-white/90 leading-snug my-2 max-w-[85%]"
      >
        Lach naar de camera en stuur je feestfoto direct live naar het grote
        scherm!
      </p>

      <label
        id="upload-label"
        class="hidden px-8 py-4 bg-[#E5BA5A] hover:bg-[#d8ae4f] text-[#0B3B3C] font-black text-sm uppercase tracking-wider rounded-2xl border-2 border-[#D4AF37] active:scale-95 transition-all cursor-pointer text-center w-full shadow-lg"
      >
        📸 MAAK EEN FOTO
        <input
          type="file"
          id="file-input"
          accept="image/*"
          capture="user"
          class="hidden"
        />
      </label>

      <div
        id="loading-bar"
        class="w-full bg-[#0B3B3C] border border-[#D4AF37] h-4 p-0.5 rounded-full overflow-hidden hidden"
      >
        <div
          class="bg-[#E5BA5A] h-full w-full animate-pulse rounded-full"
        ></div>
      </div>

      <span
        class="text-[10px] text-[#E5BA5A]/70 uppercase mt-4 tracking-widest font-semibold"
      >
        Powered by V&F Food and Events
      </span>
    </div>

    <script>
      const pbCloud = new PocketBase("https://hbmaxbooth-pb.c.rbnu.nl");

      const statusMessageEl = document.getElementById("status-message");
      const uploadLabelEl = document.getElementById("upload-label");
      const loadingBarEl = document.getElementById("loading-bar");
      const fileInputEl = document.getElementById("file-input");

      let activeEvent = null;

      async function init() {
        try {
          activeEvent = await pbCloud
            .collection("events")
            .getFirstListItem("active = true");

          uploadLabelEl.classList.remove("hidden");
        } catch (err) {
          statusMessageEl.textContent =
            "Er is momenteel geen actief evenement gevonden.";
        }
      }

      fileInputEl.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          statusMessageEl.textContent = "❌ Dit is geen geldige afbeelding!";
          return;
        }

        uploadLabelEl.classList.add("hidden");
        loadingBarEl.classList.remove("hidden");
        statusMessageEl.textContent = "Je foto wordt verstuurd...";

        try {
          const formData = new FormData();
          formData.append("event", activeEvent.id);
          formData.append("photos", file);

          await pbCloud.collection("sessions").create(formData);

          statusMessageEl.textContent = "✅ Gelukt! Kijk naar het scherm! 🎉";
          loadingBarEl.classList.add("hidden");

          setTimeout(() => {
            statusMessageEl.textContent =
              "Lach naar de camera en stuur nog een foto!";
            uploadLabelEl.classList.remove("hidden");
          }, 4000);
        } catch (err) {
          console.error(err);
          statusMessageEl.textContent =
            "❌ Upload mislukt. Probeer het opnieuw!";
          loadingBarEl.classList.add("hidden");
          uploadLabelEl.classList.remove("hidden");
        }
      });

      init();
    </script>
  </body>
</html>
